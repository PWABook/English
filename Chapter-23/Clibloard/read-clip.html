<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Clipboard</title>
</head>
<body>

<button id="readBtn">Read Clipboard</button>
<p id="output"></p>

<script>
document.getElementById("readBtn").addEventListener("click", async () => {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById("output").textContent = "Clipboard: " + text;
  } catch (err) {
    document.getElementById("output").textContent = "Failed to read: " + err;
  }
});
</script>

</body>
</html>
