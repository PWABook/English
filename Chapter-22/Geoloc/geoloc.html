<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Universal sensor page</title>
</head>

<style>
    body { font-family: sans-serif; padding: 20px;
    background-color: #e4ebfc;}
</style>

<body>
  <h1>Sensor: Geolocation</h1>
  <br>
  <button id="geo">Enable Geolocation</button>
  <p id=data>results here</p>
</body>


<script>
document.getElementById("geo").onclick = () => {
    if (!navigator.geolocation) {
        document.getElementById("data").textContent =
            "Geolocation API not supported";
        return;
    }

    navigator.geolocation.watchPosition(
        pos => {
            document.getElementById("data").textContent =
                "Latitude: " + pos.coords.latitude +
                "\nLongitude: " + pos.coords.longitude +
                "\nAccuracy: " + pos.coords.accuracy + " m";
        },
        err => {
            document.getElementById("data").textContent =
                "Error code: " + err.code +
                "\nMessage: " + err.message;
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
};

</script>


</html>
