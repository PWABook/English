<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Android Vibration Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
</style>

<body>
  <h1>Vibration</h1>

  <button id="on">Vibration On</button>

  <script>

  document.getElementById("on").onclick = () => {
  navigator.vibrate(1000);
};

  </script>

</body>
</html>
