<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Universal sensor page</title>
</head>

<style>
    body { font-family: sans-serif; padding: 20px;
    background-color: #e4ebfc;}
</style>

<body>
  <h1>Sensor: Acceleration</h1>
  <br>
  <p id=data>here the data is displayed</p>
</body>

<script>
try {
    const acc = new Accelerometer({ frequency: 30 });
    acc.onreading = () => {
        document.getElementById("data").textContent =
            "Accelerometer " +
            "x: " + acc.x.toFixed(2) + " " +
            "y: " + acc.y.toFixed(2) + " " +
            "z: " + acc.z.toFixed(2);
    };
    acc.start();
} catch (e) {
    document.getElementById("data").textContent =
    "Accelerometer is not supported";
}
</script>

</html>
