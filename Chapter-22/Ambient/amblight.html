<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Universal sensor page</title>
</head>

<style>
    body { font-family: sans-serif; padding: 20px;
    background-color: #e4ebfc;}
</style>

<body>
  <h1>Sensor: Ambient light</h1>
  <br>
  <p id=data>here the data is displayed</p>
</body>

<script>
  if ("AmbientLightSensor" in window) {
    const l = new AmbientLightSensor();
    l.onreading=() =>  document.getElementById("data").textContent =  "AmbientLight "+ l.illuminance+" lux";
    l.start();
  } else document.getElementById("data").textContent = "AmbientLight not supported";
</script>

</html>
