<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Universal sensor page</title>
</head>

<style>
    body { font-family: sans-serif; padding: 20px;
    background-color: #e4ebfc;}
</style>

<body>
  <h1>Sensor: Battery</h1>
  <br>
  <p id=data>here the data is displayed</p>
</body>

<script>
async function battery() {
    var b = await navigator.getBattery();
    var level = Math.round(b.level * 100) + "%";
    var charging = b.charging ? "charging" : "not charging";
    document.getElementById("data").textContent = "Battery: " + level + " (" + charging + ")";
}

// test the battery every second
setInterval(function () {
    battery();
}, 1000);
</script>

</html>
