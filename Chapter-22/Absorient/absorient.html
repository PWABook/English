<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ff66ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Algemene sensor pagina</title>
</head>

<style>
    body { font-family: sans-serif; padding: 20px;
    background-color: #e4ebfc;}
</style>

<body>
  <h1>Sensor: Absolute Orientation</h1>
  <br>
  <p id=data>here the data is displayed</p>
</body>

<script>

try {
    absor = new AbsoluteOrientationSensor({ frequency: 10 });

    absor.onreading = () => (
        document.getElementById("data").textContent =
            "Abs Orient " +
            absor.quaternion.map(v=>v.toFixed(2)).join(", "));
    absor.start();
}
 catch (e) {
    document.getElementById("data").textContent =
    "Absolute orientation is not supported";
}


</script>

</html>
