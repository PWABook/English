<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ff66ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>On-offline demo</title>
  <link rel="manifest" href="manifest.json">
  <script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      // The '/' at the beginning of 'sw.js' and the scope are crucial
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(reg => console.log('SW Active on scope:', reg.scope))
        .catch(err => console.error('SW Registration failed:', err));
    });
  }
  </script>
  <style>
    body { font-family: sans-serif; padding: 20px;
        background-color: #e4ebfc;}
  </style>
</head>
<body>
  <h1>Index (Cached)</h1>
  <p>This page is cached and works offline.</p>
  <a href="/page2.html">Go to Page 2</a>
</body>
</html>
